name: Deploy ScribetEx to VPS IDCloudHost

on:
  push:
    branches:
      - main
      - master
      - develop-sprint-6

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest

    steps:
      - name: SSH to VPS, Git Pull, Build on VPS, & Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:~/.bun/bin
            source ~/.bashrc 2>/dev/null || true
            cd ~/scribeTex-latex-learn-app-thesis
            git fetch --all
            git checkout develop-sprint-6 || git checkout main || true
            git pull
            bun install
            bunx prisma generate
            NODE_OPTIONS="--max-old-space-size=4096" bun run build
            pm2 restart scribetex-app || pm2 start .output/server/index.mjs --name "scribetex-app" --interpreter bun
            pm2 save
